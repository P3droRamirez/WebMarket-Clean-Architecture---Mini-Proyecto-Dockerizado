version: '3.4'

services:
  prg.webmarket.backend.webapi:
    image: ${DOCKER_REGISTRY-}prgwebmarketbackendwebapi
    container_name: webapi
    build:
      context: ./PRG.WebMarket.Backend
      dockerfile: PRG.WebMarket.Backend.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8082:8080"

  sqlserverdatabase:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=PasswordSQLServer2025
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"

  frontend:
    build:
      context: ./PRG.WebMarket.Frontend
      dockerfile: Dockerfile
    container_name: angular_front
    ports:
      - "4200:80"
    depends_on:
      - prg.webmarket.backend.webapi

volumes:
  sqlserver-data:
